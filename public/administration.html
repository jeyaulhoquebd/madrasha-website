<!doctype html>
<html lang="bn" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>প্রশাসন ও পরিচালনা পর্ষদ - খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল (ডিগ্রী) মাদ্রাসা</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css">
  </head>
  <body class="bg-stone-50 text-slate-800 antialiased font-['Hind_Siliguri',sans-serif] flex flex-col min-h-screen">
    <div id="site-header"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
      <div class="bg-white rounded-xl border border-stone-200 p-6 sm:p-10 shadow-xs space-y-6">
        <h1 class="text-2xl sm:text-3xl font-bold text-[#072e10] border-b border-stone-100 pb-4">
          প্রশাসন ও পরিচালনা পর্ষদ
        </h1>
        
        <div id="admin-committee-container"></div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module">
      import { initPageLayout } from '/assets/js/components/layout.js';
      import { renderEmptyState } from '/assets/js/components/emptyState.js';

      initPageLayout({
        activePage: 'administration',
        breadcrumbs: [
          { label: 'প্রশাসন', url: '/administration.html' },
          { label: 'পরিচালনা পর্ষদ' }
        ]
      });

      // Render verified empty state until admin populates committee list
      document.getElementById('admin-committee-container').innerHTML = renderEmptyState({
        title: 'পরিচালনা পর্ষদের তথ্য হালনাগাদাধীন',
        message: 'মাদ্রাসার বর্তমান গভর্নিং বডি ও পরিচালনা পর্ষদের সদস্যবৃন্দের তালিকা প্রশাসনিকভাবে অনুমোদনের পর এখানে প্রকাশ করা হবে।',
        icon: 'users'
      });
    </script>
  </body>
</html>
