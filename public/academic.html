<!doctype html>
<html lang="bn" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>শিক্ষা কার্যক্রম ও একাডেমিক তথ্য - খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল (ডিগ্রী) মাদ্রাসা</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css">
  </head>
  <body class="bg-stone-50 text-slate-800 antialiased font-['Hind_Siliguri',sans-serif] flex flex-col min-h-screen">
    <div id="site-header"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
      <div class="bg-white rounded-xl border border-stone-200 p-6 sm:p-10 shadow-xs space-y-6">
        <h1 class="text-2xl sm:text-3xl font-bold text-[#072e10] border-b border-stone-100 pb-4">
          শিক্ষা কার্যক্রম ও পাঠ্যক্রম
        </h1>
        
        <p class="text-stone-600 text-sm leading-relaxed">
          খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল (ডিগ্রী) মাদ্রাসায় প্রাথমিক স্তর (ইবতেদায়ী) থেকে শুরু করে ফাজিল (ডিগ্রী) স্তর পর্যন্ত সরকার অনুমোদিত পাঠ্যক্রম অনুযায়ী পাঠদান করা হয়।
        </p>

        <div id="academic-content-container"></div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module">
      import { initPageLayout } from '/assets/js/components/layout.js';
      import { renderEmptyState } from '/assets/js/components/emptyState.js';

      initPageLayout({
        activePage: 'academic',
        breadcrumbs: [{ label: 'একাডেমিক', url: '/academic.html' }]
      });

      document.getElementById('academic-content-container').innerHTML = renderEmptyState({
        title: 'একাডেমিক পূর্ণাঙ্গ তথ্য হালনাগাদাধীন',
        message: 'চলতি শিক্ষাবর্ষের বিষয়ভিত্তিক বিস্তারিত পাঠ্যক্রম ও বিভাগীয় নির্দেশিকা প্রশাসনিকভাবে সংযোজন করা হচ্ছে।',
        icon: 'folder'
      });
    </script>
  </body>
</html>
