<!doctype html>
<html lang="bn" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>নোটিশ বোর্ড - খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল (ডিগ্রী) মাদ্রাসা</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css">
  </head>
  <body class="bg-stone-50 text-slate-800 antialiased font-['Hind_Siliguri',sans-serif] flex flex-col min-h-screen">
    <div id="site-header"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full space-y-6">
      <div class="bg-white rounded-xl border border-stone-200 p-6 sm:p-10 shadow-xs">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-stone-100 pb-4 mb-6 gap-3">
          <div>
            <h1 class="text-2xl sm:text-3xl font-bold text-[#072e10]">
              প্রাতিষ্ঠানিক নোটিশ বোর্ড
            </h1>
            <p class="text-xs sm:text-sm text-stone-500 mt-1">মাদ্রাসার সকল পরীক্ষা, ছুটি, ভর্তি ও প্রাতিষ্ঠানিক বিজ্ঞপ্তি</p>
          </div>
        </div>

        <div id="notices-list-container"></div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module">
      import { initPageLayout } from '/assets/js/components/layout.js';
      import { renderEmptyState } from '/assets/js/components/emptyState.js';

      initPageLayout({
        activePage: 'notices',
        breadcrumbs: [{ label: 'নোটিশ বোর্ড', url: '/notices.html' }]
      });

      document.getElementById('notices-list-container').innerHTML = renderEmptyState({
        title: 'বর্তমানে কোনো নোটিশ নেই',
        message: 'কর্তৃপক্ষ কর্তৃক নতুন কোনো নোটিশ প্রকাশিত হলে তা সাথে সাথে এই বোর্ডে প্রদর্শিত হবে।',
        icon: 'bell'
      });
    </script>
  </body>
</html>
