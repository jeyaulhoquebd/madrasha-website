<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ভর্তি আবেদনপত্র — প্রশাসনিক প্যানেল</title>
    <link rel="icon" href="https://res.cloudinary.com/edsn06rr/image/upload/v1793898297/images.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css?v=20261108b">
  </head>
  <body class="invisible flex min-h-screen flex-col bg-ivory">
    <div id="admin-header-slot" class="no-print"></div>

    <main class="mx-auto w-full max-w-3xl flex-grow px-4 py-8 sm:px-6">
      <div class="no-print mb-4 flex items-center justify-between">
        <a href="/admin/admissions.html" class="text-sm text-stone-500 hover:text-brand-700">← সকল আবেদন</a>
        <button type="button" onclick="window.print()" class="btn btn-primary">প্রিন্ট করুন</button>
      </div>
      <article id="application" class="card p-8"><p class="text-center text-sm text-stone-400">লোড হচ্ছে...</p></article>
    </main>

    <style>@media print { #admin-header-slot, .no-print { display: none !important } body { background: #fff } .card { border: 0 } }</style>

    <script type="module">
      import { initAdminPage } from '/assets/app/admin/adminLayout.js';
      import { db, doc, getDoc } from '/assets/app/firebase/config.js';
      import { esc } from '/assets/app/utils/escape.js';
      import { formatBengaliDate } from '/assets/app/utils/date.js';
      import { SITE } from '/assets/app/site.js';

      await initAdminPage('admissions');
      const box = document.getElementById('application');
      const id = new URLSearchParams(location.search).get('id');

      const STATUS = { pending: 'অপেক্ষমান', contacted: 'যোগাযোগ করা হয়েছে', approved: 'ভর্তি সম্পন্ন', rejected: 'বাতিল' };
      const row = (k, v) => v ? `<tr><th class="w-2/5 border-b border-stone-100 py-2 pr-4 text-left align-top font-normal text-stone-500">${k}</th><td class="border-b border-stone-100 py-2 text-stone-900">${esc(v)}</td></tr>` : '';
      const group = (title, rows) => rows.trim() ? `<h3 class="mt-6 mb-1 text-sm font-semibold text-brand-800">${title}</h3><table class="w-full text-sm">${rows}</table>` : '';

      try {
        const snap = await getDoc(doc(db, 'admissions', id || '-'));
        if (!snap.exists()) throw new Error('আবেদন পাওয়া যায়নি');
        const a = snap.data();
        document.title = `${a.studentName} — ভর্তি আবেদন`;
        box.innerHTML = `
          <header class="flex items-start justify-between gap-6 border-b-2 border-brand-800 pb-5">
            <div class="flex items-start gap-4">
              <img src="${SITE.logoUrl}" alt="" class="h-16 w-16 rounded-full border border-stone-200 object-contain" />
              <div>
                <p class="text-lg font-bold leading-snug text-brand-900">${SITE.name}</p>
                <p class="text-xs text-stone-500">${SITE.address} · EIIN ${SITE.eiin}</p>
                <p class="mt-3 inline-block rounded bg-brand-50 px-2 py-0.5 text-sm font-semibold text-brand-800">ভর্তি আবেদনপত্র</p>
              </div>
            </div>
            ${a.photo ? `<img src="${esc(a.photo)}" alt="" class="h-36 w-28 flex-shrink-0 border border-stone-300 object-cover" />` : ''}
          </header>
          <p class="mt-4 text-xs text-stone-500">আবেদন নম্বর: <span class="font-mono font-semibold text-stone-800">${esc(snap.id.slice(0, 8).toUpperCase())}</span>
            · জমার তারিখ: ${formatBengaliDate(a.createdAt, true)} · অবস্থা: ${STATUS[a.status] || esc(a.status)}</p>
          ${group('ভর্তির তথ্য', row('শ্রেণি', a.classApplied) + row('শিক্ষাবর্ষ', a.session))}
          ${group('শিক্ষার্থীর তথ্য', row('নাম (বাংলা)', a.studentName) + row('নাম (ইংরেজি)', a.studentNameEn) + row('জন্ম তারিখ', a.dateOfBirth) + row('লিঙ্গ', a.gender) + row('জন্ম নিবন্ধন নম্বর', a.birthRegNo) + row('NID নম্বর', a.nid) + row('রক্তের গ্রুপ', a.bloodGroup))}
          ${group('পিতা-মাতা ও অভিভাবক', row('পিতার নাম', a.fatherName) + row('পিতার মোবাইল', a.fatherPhone) + row('পিতার NID', a.fatherNid) + row('পিতার পেশা', a.fatherOccupation) + row('মাতার নাম', a.motherName) + row('মাতার মোবাইল', a.motherPhone) + row('মাতার NID', a.motherNid) + row('অভিভাবক', a.guardianName && `${a.guardianName} (${a.guardianRelation || '—'})`) + row('অভিভাবকের মোবাইল', a.guardianPhone))}
          ${group('ঠিকানা', row('বর্তমান ঠিকানা', a.presentAddress || a.address) + row('স্থায়ী ঠিকানা', a.permanentAddress))}
          ${group('পূর্ববর্তী শিক্ষা', row('প্রতিষ্ঠান', a.previousSchool) + row('সর্বশেষ শ্রেণি/পরীক্ষা', a.previousClass) + row('ফলাফল', a.previousResult) + row('রোল', a.prevExamRoll) + row('রেজিস্ট্রেশন', a.prevExamReg) + row('পাসের সাল', a.prevExamYear) + row('বোর্ড', a.prevBoard))}
          ${group('অন্যান্য', row('অতিরিক্ত তথ্য', a.notes) + row('অফিস নোট', a.adminNote))}
          <div class="mt-16 grid grid-cols-2 gap-10 text-center text-xs text-stone-500">
            <p class="border-t border-stone-400 pt-2">অভিভাবকের স্বাক্ষর</p>
            <p class="border-t border-stone-400 pt-2">অধ্যক্ষ / মুহতামিমের স্বাক্ষর</p>
          </div>`;
      } catch (e) {
        box.innerHTML = `<p class="text-center text-sm text-rose-700">${esc(e.message)}</p>`;
      }
    </script>
  </body>
</html>
