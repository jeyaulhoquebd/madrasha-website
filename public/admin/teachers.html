<!doctype html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body class="bg-stone-100 text-slate-800 antialiased font-['Hind_Siliguri',sans-serif] min-h-screen flex flex-col">
    <div id="admin-header-slot"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-xl border border-stone-200">
        <div>

        <button class="inline-flex items-center gap-2 px-4 py-2.5 bg-[#0B4619] hover:bg-[#072e10] text-white text-xs font-bold rounded-lg shadow transition">

        </button>
      </div>

      <div class="bg-white rounded-xl border border-stone-200 p-6 shadow-xs">
        <p class="text-xs text-stone-500 text-center py-8">কোনো শিক্ষক প্রোফাইল সংরক্ষিত নেই। অনুমোদিত শিক্ষকদের তথ্য যোগ করতে উপরের বাটনে ক্লিক করুন।</p>
      </div>
    </main>

    <script type="module">
      import { renderAdminHeader } from '/assets/js/admin/adminLayout.js';
      document.getElementById('admin-header-slot').innerHTML = renderAdminHeader('teachers');
