<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ড্যাশবোর্ড — প্রশাসনিক প্যানেল</title>
    <link rel="icon" href="https://res.cloudinary.com/edsn06rr/image/upload/v1793898297/images.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css">
  </head>
  <body class="invisible flex min-h-screen flex-col bg-ivory">
    <div id="admin-header-slot"></div>

    <main class="mx-auto w-full max-w-6xl flex-grow space-y-8 px-4 py-8 sm:px-6 lg:px-8">
      <div>
        <p class="text-sm text-stone-500" id="dash-greeting">আসসালামু আলাইকুম</p>
        <h1 class="text-2xl font-bold text-brand-900">ড্যাশবোর্ড</h1>
      </div>

      <section id="dash-stats" class="grid grid-cols-2 gap-4 lg:grid-cols-4"></section>

      <section class="grid gap-6 lg:grid-cols-2">
        <div class="card">
          <div class="flex items-center justify-between border-b border-stone-100 px-5 py-4">
            <h2 class="font-semibold text-brand-900">সাম্প্রতিক ভর্তি আবেদন</h2>
            <a href="/admin/admissions.html" class="text-xs font-semibold text-brand-700 hover:underline">সব দেখুন</a>
          </div>
          <div id="dash-admissions" class="divide-y divide-stone-100"><p class="px-5 py-8 text-center text-sm text-stone-400">লোড হচ্ছে...</p></div>
        </div>
        <div class="card">
          <div class="flex items-center justify-between border-b border-stone-100 px-5 py-4">
            <h2 class="font-semibold text-brand-900">সাম্প্রতিক বার্তা</h2>
            <a href="/admin/messages.html" class="text-xs font-semibold text-brand-700 hover:underline">সব দেখুন</a>
          </div>
          <div id="dash-messages" class="divide-y divide-stone-100"><p class="px-5 py-8 text-center text-sm text-stone-400">লোড হচ্ছে...</p></div>
        </div>
      </section>

      <section>
        <h2 class="mb-4 text-sm font-semibold text-stone-500">দ্রুত কাজ</h2>
        <div id="dash-actions" class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4"></div>
      </section>
    </main>

    <script type="module">
      import { initAdminPage } from '/assets/js/admin/adminLayout.js';
      import { db, collection, getDocs, getCountFromServer } from '/assets/js/firebase/config.js';
      import { esc } from '/assets/js/utils/escape.js';
      import { toBengaliNumber, formatBengaliDate, sortByDateDesc } from '/assets/js/utils/date.js';

      const user = await initAdminPage('dashboard');
      if (user?.email) document.getElementById('dash-greeting').textContent = `আসসালামু আলাইকুম, ${user.email}`;

      const ACTIONS = [
        ['নোটিশ প্রকাশ', '/admin/notices.html'], ['শিক্ষক যুক্ত করুন', '/admin/teachers.html'],
        ['ফলাফল প্রকাশ', '/admin/results.html'], ['রুটিন যুক্ত করুন', '/admin/routines.html'],
        ['ফাইল আপলোড', '/admin/downloads.html'], ['গ্যালারি', '/admin/gallery.html'],
        ['পরিচালনা পর্ষদ', '/admin/administration.html'], ['সেটিংস ও অধ্যক্ষের বাণী', '/admin/settings.html']
      ];
      document.getElementById('dash-actions').innerHTML = ACTIONS.map(([l, u]) =>
        `<a href="${u}" class="card card-hover px-4 py-3.5 text-sm font-medium text-stone-700 hover:text-brand-800">${l} →</a>`).join('');

      const count = async (name) => {
        try { return (await getCountFromServer(collection(db, name))).data().count; } catch { return null; }
      };
      const all = async (name) => {
        try { return (await getDocs(collection(db, name))).docs.map(d => ({ id: d.id, ...d.data() })); } catch { return []; }
      };

      const [notices, teachers, admissions, messages] = await Promise.all([count('notices'), count('teachers'), all('admissions'), all('messages')]);
      const pending = admissions.filter(a => (a.status || 'pending') === 'pending').length;
      const unread = messages.filter(m => !m.handled).length;

      const stat = (label, value, href, accent = false) => `
        <a href="${href}" class="card card-hover p-5">
          <p class="text-xs text-stone-500">${label}</p>
          <p class="mt-2 text-3xl font-bold ${accent && value ? 'text-gold-600' : 'text-brand-900'}">${value === null ? '—' : toBengaliNumber(value)}</p>
        </a>`;
      document.getElementById('dash-stats').innerHTML = [
        stat('অপেক্ষমান ভর্তি আবেদন', pending, '/admin/admissions.html', true),
        stat('নতুন বার্তা', unread, '/admin/messages.html', true),
        stat('মোট নোটিশ', notices, '/admin/notices.html'),
        stat('মোট শিক্ষক', teachers, '/admin/teachers.html')
      ].join('');

      const empty = msg => `<p class="px-5 py-8 text-center text-sm text-stone-400">${msg}</p>`;
      const recentAdm = sortByDateDesc(admissions, 'createdAt').slice(0, 5);
      document.getElementById('dash-admissions').innerHTML = recentAdm.length ? recentAdm.map(a => `
        <a href="/admin/admissions.html" class="block px-5 py-3 hover:bg-stone-50">
          <p class="text-sm font-medium text-stone-800">${esc(a.studentName)} <span class="font-normal text-stone-500">· ${esc(a.classApplied)}</span></p>
          <p class="text-xs text-stone-500">${esc(a.phone)} · ${formatBengaliDate(a.createdAt)}</p>
        </a>`).join('') : empty('কোনো আবেদন নেই');

      const recentMsg = sortByDateDesc(messages, 'createdAt').slice(0, 5);
      document.getElementById('dash-messages').innerHTML = recentMsg.length ? recentMsg.map(m => `
        <a href="/admin/messages.html" class="block px-5 py-3 hover:bg-stone-50">
          <p class="truncate text-sm font-medium text-stone-800">${m.handled ? '' : '<span class="mr-1 inline-block h-2 w-2 rounded-full bg-gold-500"></span>'}${esc(m.name)} <span class="font-normal text-stone-500">· ${esc(m.subject)}</span></p>
          <p class="truncate text-xs text-stone-500">${esc(String(m.message || '').slice(0, 90))}</p>
        </a>`).join('') : empty('কোনো বার্তা নেই');
    </script>
  </body>
</html>
