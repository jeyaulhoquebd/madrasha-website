<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>সাধারণ সেটিংস - প্রশাসনিক পোর্টাল</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css">
  </head>
  <body class="bg-stone-100 text-slate-800 antialiased font-['Hind_Siliguri',sans-serif] min-h-screen flex flex-col">
    <div id="admin-header-slot"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-6">
      <div class="bg-white p-6 rounded-xl border border-stone-200">
        <h1 class="text-xl sm:text-2xl font-bold text-[#072e10]">প্রাতিষ্ঠানিক ও প্রযুক্তিগত সেটিংস</h1>
        <p class="text-xs sm:text-sm text-stone-500 mt-1">মাদ্রাসার ঠিকানা, ফোন, ইমেইল ও ক্লাউড কনফিগারেশন</p>
      </div>

      <div class="bg-white rounded-xl border border-stone-200 p-6 sm:p-8 shadow-xs space-y-6">
        <form id="settings-form" class="space-y-4 text-xs sm:text-sm">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">প্রতিষ্ঠানের নাম</label>
            <input type="text" readonly value="খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল (ডিগ্রী) মাদ্রাসা" class="w-full px-3.5 py-2.5 border border-stone-200 bg-stone-50 rounded-lg text-slate-700">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">ইআইআইএন (EIIN)</label>
              <input type="text" readonly value="১৩১৩২৫" class="w-full px-3.5 py-2.5 border border-stone-200 bg-stone-50 rounded-lg text-slate-700 font-mono">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">প্রতিষ্ঠা সাল</label>
              <input type="text" readonly value="১৯৯৮" class="w-full px-3.5 py-2.5 border border-stone-200 bg-stone-50 rounded-lg text-slate-700">
            </div>
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">ক্যাম্পাসের ঠিকানা</label>
            <input type="text" value="জেল রোড, খাগড়াছড়ি সদর, খাগড়াছড়ি পার্বত্য জেলা" class="w-full px-3.5 py-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#0B4619] bg-white text-slate-800">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">অফিসিয়াল ইমেইল</label>
              <input type="email" value="info@kbjadfml.edu.bd" class="w-full px-3.5 py-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#0B4619] bg-white text-slate-800">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">হেল্পলাইন নম্বর</label>
              <input type="text" value="০১৮১৬-XXXXXX" class="w-full px-3.5 py-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#0B4619] bg-white text-slate-800">
            </div>
          </div>

          <div class="pt-4 border-t border-stone-100 flex justify-end">
            <button type="submit" class="px-5 py-2.5 bg-[#0B4619] hover:bg-[#072e10] text-white font-bold rounded-lg shadow transition">
              পরিবর্তন সংরক্ষণ করুন
            </button>
          </div>
        </form>
      </div>
    </main>

    <script type="module">
      import { renderAdminHeader } from '/assets/js/admin/adminLayout.js';
      import { showAlert } from '/assets/js/components/alert.js';

      document.getElementById('admin-header-slot').innerHTML = renderAdminHeader('settings');

      document.getElementById('settings-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        showAlert({ type: 'success', message: 'সেটিংস সফলভাবে সংরক্ষিত হয়েছে।' });
      });
    </script>
  </body>
</html>
