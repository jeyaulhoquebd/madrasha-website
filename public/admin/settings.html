<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>সাধারণ সেটিংস - প্রশাসনিক পোর্টাল</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css">
  </head>
  <body class="flex min-h-screen flex-col bg-ivory">
    <div id="admin-header-slot"></div>

    <main class="mx-auto w-full max-w-3xl flex-grow space-y-6 px-4 py-8 sm:px-6 lg:px-8">
      <div>
        <h1 class="text-2xl font-bold text-brand-900">সাধারণ সেটিংস</h1>
        <p class="mt-1 text-sm text-stone-500">এখানে দেওয়া যোগাযোগের তথ্য ওয়েবসাইটের হেডার, ফুটার ও যোগাযোগ পাতায় দেখা যাবে। খালি রাখলে তা দেখানো হবে না।</p>
      </div>

      <form id="settings-form" class="card space-y-5 p-6 sm:p-8">
        <div class="grid gap-5 sm:grid-cols-2">
          <label class="block sm:col-span-2"><span class="field-label">প্রতিষ্ঠানের নাম</span>
            <input type="text" readonly value="খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল (ডিগ্রী) মাদ্রাসা" class="field bg-stone-50 text-stone-500"></label>
          <label class="block sm:col-span-2"><span class="field-label">ঠিকানা</span>
            <input type="text" name="address" maxlength="200" class="field" placeholder="জেল রোড, খাগড়াছড়ি সদর, খাগড়াছড়ি পার্বত্য জেলা"></label>
          <label class="block"><span class="field-label">ফোন নম্বর</span>
            <input type="tel" name="phone" maxlength="30" class="field"></label>
          <label class="block"><span class="field-label">ইমেইল</span>
            <input type="email" name="email" maxlength="120" class="field"></label>
          <label class="block"><span class="field-label">অফিস সময়</span>
            <input type="text" name="officeHours" maxlength="100" class="field" placeholder="শনি – বৃহস্পতি, সকাল ৯টা – বিকাল ৪টা"></label>
          <label class="block"><span class="field-label">ডেভেলপার ক্রেডিট</span>
            <input type="text" name="developerCredit" maxlength="100" class="field"></label>
          <label class="block"><span class="field-label">ফেসবুক পেজ লিংক</span>
            <input type="url" name="facebookUrl" maxlength="300" class="field" placeholder="https://facebook.com/..."></label>
          <label class="block"><span class="field-label">ইউটিউব চ্যানেল লিংক</span>
            <input type="url" name="youtubeUrl" maxlength="300" class="field" placeholder="https://youtube.com/..."></label>
          <label class="block sm:col-span-2"><span class="field-label">গুগল ম্যাপ এম্বেড লিংক</span>
            <input type="url" name="mapEmbedUrl" maxlength="1000" class="field" placeholder="https://www.google.com/maps/embed?pb=..."></label>
        </div>
        <div class="flex justify-end border-t border-stone-100 pt-5">
          <button type="submit" id="settings-save-btn" class="btn btn-primary">সংরক্ষণ করুন</button>
        </div>
      </form>
    </main>

    <script type="module">
      import { initAdminPage } from '/assets/js/admin/adminLayout.js';
      import { db, doc, getDoc, setDoc, serverTimestamp } from '/assets/js/firebase/config.js';
      import { showAlert } from '/assets/js/components/alert.js';

      const FIELDS = ['address', 'phone', 'email', 'officeHours', 'developerCredit', 'facebookUrl', 'youtubeUrl', 'mapEmbedUrl'];
      const form = document.getElementById('settings-form');
      const btn = document.getElementById('settings-save-btn');

      await initAdminPage('settings');

      try {
        const snap = await getDoc(doc(db, 'settings', 'general'));
        if (snap.exists()) {
          const data = snap.data();
          FIELDS.forEach(f => { if (data[f]) form.elements[f].value = data[f]; });
        }
      } catch (e) {
        showAlert({ type: 'error', message: 'সেটিংস লোড করা যায়নি: ' + e.message });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = { updatedAt: serverTimestamp() };
        FIELDS.forEach(f => { data[f] = form.elements[f].value.trim(); });

        btn.disabled = true;
        btn.textContent = 'সংরক্ষণ হচ্ছে...';
        try {
          await setDoc(doc(db, 'settings', 'general'), data, { merge: true });
          showAlert({ type: 'success', message: 'সেটিংস সংরক্ষিত হয়েছে।' });
        } catch (err) {
          showAlert({ type: 'error', message: 'সংরক্ষণ ব্যর্থ হয়েছে: ' + err.message });
        } finally {
          btn.disabled = false;
          btn.textContent = 'সংরক্ষণ করুন';
        }
      });
    </script>
  </body>
</html>
