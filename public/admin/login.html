<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>প্রশাসনিক লগইন - খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল (ডিগ্রী) মাদ্রাসা</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css">
  </head>
  <body class="bg-stone-100 min-h-screen flex items-center justify-center p-4 font-['Hind_Siliguri',sans-serif]">
    
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-stone-200 overflow-hidden">
      <!-- Header Banner -->
      <div class="bg-gradient-to-r from-[#072e10] to-[#0B4619] p-6 text-white text-center border-b-4 border-[#d4af37]">
        <div class="w-16 h-16 rounded-full bg-white/10 p-1 mx-auto mb-3 flex items-center justify-center ring-2 ring-amber-400">
          <svg class="w-8 h-8 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h1 class="text-lg sm:text-xl font-bold">প্রশাসনিক নিয়ন্ত্রণ কেন্দ্র</h1>
        <p class="text-xs text-emerald-200 mt-1">খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল মাদ্রাসা</p>
      </div>

      <!-- Form Body -->
      <div class="p-6 sm:p-8 space-y-5">
        <div class="bg-amber-50 border border-amber-200 text-amber-900 text-xs p-3 rounded-lg flex items-start gap-2">
          <svg class="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>শুধুমাত্র অনুমোদিত প্রাতিষ্ঠানিক দায়িত্বপ্রাপ্ত কর্মকর্তাদের প্রবেশের জন্য।</span>
        </div>

        <form id="admin-login-form" class="space-y-4 text-xs sm:text-sm">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">অফিসিয়াল ইমেইল ঠিকানা</label>
            <input type="email" id="admin-email" required class="w-full px-3.5 py-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#0B4619] focus:outline-hidden bg-white text-slate-800" placeholder="admin@kbjadfml.edu.bd">
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">গোপন পাসওয়ার্ড</label>
            <input type="password" id="admin-password" required class="w-full px-3.5 py-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#0B4619] focus:outline-hidden bg-white text-slate-800" placeholder="••••••••">
          </div>

          <button type="submit" id="login-submit-btn" class="w-full py-3 bg-[#0B4619] hover:bg-[#072e10] text-white font-bold rounded-lg shadow-md transition transform active:scale-98">
            লগইন করুন
          </button>
        </form>

        <div class="pt-4 border-t border-stone-100 text-center">
          <a href="/" class="text-xs font-semibold text-[#0B4619] hover:underline">
            ← মূল ওয়েবসাইটে ফিরে যান
          </a>
        </div>
      </div>
    </div>

    <script type="module">
      import { auth, signInWithEmailAndPassword } from '/assets/js/firebase/config.js';
      import { showAlert } from '/assets/js/components/alert.js';

      const form = document.getElementById('admin-login-form');
      const submitBtn = document.getElementById('login-submit-btn');

      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('admin-email').value.trim();
        const password = document.getElementById('admin-password').value;

        submitBtn.disabled = true;
        submitBtn.innerText = 'যাচাই করা হচ্ছে...';

        try {
          if (auth) {
            await signInWithEmailAndPassword(auth, email, password);
            showAlert({ type: 'success', message: 'লগইন সফল হয়েছে। ড্যাশবোর্ডে প্রবেশ করা হচ্ছে...' });
            setTimeout(() => window.location.href = '/admin/index.html', 1000);
          } else {
            // Standby mode notification
            showAlert({ type: 'info', message: 'ফায়ারবেস ক্লাউড সেবা সংযোগের পর এডমিন অ্যাক্সেস সরাসরি সক্রিয় হবে।' });
            setTimeout(() => window.location.href = '/admin/index.html', 1200);
          }
        } catch (error) {
          showAlert({ type: 'error', message: 'লগইন ব্যর্থ হয়েছে: ' + (error.message || 'ভুল ইমেইল বা পাসওয়ার্ড') });
          submitBtn.disabled = false;
          submitBtn.innerText = 'লগইন করুন';
        }
      });
    </script>
  </body>
</html>
