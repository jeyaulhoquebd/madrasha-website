<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>প্রশাসনিক লগইন - খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল (ডিগ্রি) মাদ্রাসা</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css?v=20261108c">
  </head>
  <body class="flex min-h-screen items-center justify-center bg-ivory p-4">
    <div class="w-full max-w-sm">
      <div class="mb-8 text-center">
        <img src="https://res.cloudinary.com/edsn06rr/image/upload/v1793898297/images.jpg" alt="" class="mx-auto h-16 w-16 rounded-full border border-stone-200 bg-white object-contain" />
        <h1 class="mt-4 text-xl font-bold text-brand-900">এডমিন / মডারেটর লগইন</h1>
        <p class="mt-1 text-sm text-stone-500">বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল মাদ্রাসা</p>
      </div>

      <div class="card p-6 sm:p-8">
        <p id="login-notice" class="mb-5 hidden rounded-lg bg-gold-100/70 px-4 py-3 text-sm text-stone-700"></p>

        <form id="admin-login-form" class="space-y-4">
          <label class="block"><span class="field-label">ইমেইল</span>
            <input type="email" id="admin-email" required autocomplete="username" class="field"></label>
          <label class="block"><span class="field-label">পাসওয়ার্ড</span>
            <input type="password" id="admin-password" required autocomplete="current-password" class="field"></label>
          <div><span class="field-label">মানব-যাচাই</span><div id="admin-turnstile" class="min-h-[65px]"></div></div>
          <button type="submit" id="login-submit-btn" class="btn btn-primary w-full">লগইন</button>
        </form>
      </div>

      <p class="mt-6 text-center text-sm"><a href="/" class="text-stone-500 hover:text-brand-700">← মূল ওয়েবসাইট</a></p>
    </div>

    <script type="module">
      import { auth, getStaffRole, signInWithEmailAndPassword, signOut } from '/assets/app/firebase/config.js';
      import { showAlert } from '/assets/app/components/alert.js';
      import { mountTurnstile, verifyHuman } from '/assets/app/components/turnstile.js';
      const captcha = mountTurnstile(document.getElementById('admin-turnstile'), { action: 'admin-login' });

      const form = document.getElementById('admin-login-form');
      const btn = document.getElementById('login-submit-btn');
      const notice = document.getElementById('login-notice');

      const showNotice = (msg) => { notice.textContent = msg; notice.classList.remove('hidden'); };
      const reason = new URLSearchParams(location.search).get('reason');

      if (!auth) {
        showNotice('Firebase-এর সাথে সংযোগ করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে পাতাটি রিফ্রেশ করুন।');
        btn.disabled = true;
      } else if (reason === 'forbidden') {
        showNotice('এই অ্যাকাউন্টের প্রশাসনিক অনুমতি নেই।');
      } else if (reason === 'disabled') {
        showNotice('এই মডারেটর অ্যাকাউন্টটি বন্ধ করা হয়েছে। এডমিনের সাথে যোগাযোগ করুন।');
      }

      // Login link for moderators: /admin/login.html?email=...
      const presetEmail = new URLSearchParams(location.search).get('email');
      if (presetEmail) {
        document.getElementById('admin-email').value = presetEmail;
        document.getElementById('admin-password').focus();
      }

      const ERRORS = {
        'auth/invalid-credential': 'ইমেইল বা পাসওয়ার্ড সঠিক নয়।',
        'auth/wrong-password': 'ইমেইল বা পাসওয়ার্ড সঠিক নয়।',
        'auth/user-not-found': 'ইমেইল বা পাসওয়ার্ড সঠিক নয়।',
        'auth/too-many-requests': 'অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।',
        'auth/network-request-failed': 'ইন্টারনেট সংযোগ পরীক্ষা করুন।'
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!auth) return;

        btn.disabled = true;
        btn.textContent = 'যাচাই করা হচ্ছে...';
        const human = await verifyHuman(captcha.getToken());
        if (!human.ok) {
          showAlert({ type: 'error', message: human.message });
          captcha.reset();
          btn.disabled = false;
          btn.textContent = 'লগইন';
          return;
        }
        try {
          const { user } = await signInWithEmailAndPassword(auth, document.getElementById('admin-email').value.trim(), document.getElementById('admin-password').value);
          const role = await getStaffRole(user);
          if (role?.role === 'disabled') {
            await signOut(auth);
            throw { code: 'disabled' };
          }
          if (!role) {
            await signOut(auth);
            throw { code: 'not-admin' };
          }
          window.location.replace('/admin/');
        } catch (error) {
          const msg = error.code === 'not-admin' ? 'এই অ্যাকাউন্টের প্রশাসনিক অনুমতি নেই।'
            : error.code === 'disabled' ? 'এই মডারেটর অ্যাকাউন্টটি বন্ধ করা হয়েছে।'
            : (ERRORS[error.code] || 'লগইন ব্যর্থ হয়েছে।');
          showAlert({ type: 'error', message: msg });
          captcha.reset();
          btn.disabled = false;
          btn.textContent = 'লগইন';
        }
      });
    </script>
  </body>
</html>
