<!doctype html>
<html lang="bn" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>যোগাযোগ ও অবস্থান - খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া আদর্শ ফাজিল (ডিগ্রী) মাদ্রাসা</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/output.css">
  </head>
  <body class="bg-stone-50 text-slate-800 antialiased font-['Hind_Siliguri',sans-serif] flex flex-col min-h-screen">
    <div id="site-header"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full space-y-8">
      <div class="bg-white rounded-xl border border-stone-200 p-6 sm:p-10 shadow-xs">
        <h1 class="text-2xl sm:text-3xl font-bold text-[#072e10] border-b border-stone-100 pb-4 mb-6">
          যোগাযোগ ও অবস্থান
        </h1>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <!-- Institutional Address Details -->
          <div class="space-y-6">
            <div class="space-y-4 text-stone-700 text-sm">
              <div class="flex items-start gap-3">
                <div class="w-9 h-9 rounded-full bg-emerald-50 text-[#0B4619] flex items-center justify-center flex-shrink-0 mt-0.5">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <div>
                  <h3 class="font-bold text-slate-800">মাদ্রাসার স্থায়ী ক্যাম্পাস</h3>
                  <p class="text-stone-600 mt-1">জেল রোড, খাগড়াছড়ি সদর, খাগড়াছড়ি পার্বত্য জেলা, বাংলাদেশ</p>
                </div>
              </div>

              <div class="flex items-start gap-3">
                <div class="w-9 h-9 rounded-full bg-emerald-50 text-[#0B4619] flex items-center justify-center flex-shrink-0 mt-0.5">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                  <h3 class="font-bold text-slate-800">ইমেইল যোগাযোগ</h3>
                  <p class="text-stone-600 mt-1 font-mono">info@kbjadfml.edu.bd</p>
                </div>
              </div>

              <div class="flex items-start gap-3">
                <div class="w-9 h-9 rounded-full bg-emerald-50 text-[#0B4619] flex items-center justify-center flex-shrink-0 mt-0.5">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                </div>
                <div>
                  <h3 class="font-bold text-slate-800">অফিস অনুসন্ধান হেল্পলাইন</h3>
                  <p class="text-stone-600 mt-1 font-mono">০১৮১৬-XXXXXX (সকাল ৯:০০ - বিকাল ৪:০০)</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Message Inquiries Form -->
          <div class="bg-stone-50 p-6 rounded-xl border border-stone-200">
            <h3 class="font-bold text-base text-[#072e10] mb-4">আমাদের বার্তা পাঠান</h3>
            <form id="contact-form" class="space-y-4 text-xs sm:text-sm">
              <div>
                <label class="block font-medium text-slate-700 mb-1">আপনার পূর্ণ নাম *</label>
                <input type="text" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:ring-2 focus:ring-[#0B4619] focus:outline-hidden bg-white" placeholder="নাম লিখুন">
              </div>
              <div>
                <label class="block font-medium text-slate-700 mb-1">মোবাইল নম্বর *</label>
                <input type="tel" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:ring-2 focus:ring-[#0B4619] focus:outline-hidden bg-white" placeholder="০১XXXXXXXXX">
              </div>
              <div>
                <label class="block font-medium text-slate-700 mb-1">আপনার বার্তা বা মন্তব্য *</label>
                <textarea required rows="4" class="w-full px-3 py-2 border border-stone-300 rounded-md focus:ring-2 focus:ring-[#0B4619] focus:outline-hidden bg-white" placeholder="এখানে বিস্তারিত লিখুন..."></textarea>
              </div>
              <button type="submit" class="w-full py-2.5 px-4 bg-[#0B4619] hover:bg-[#072e10] text-white font-bold rounded-md shadow transition">
                বার্তা প্রেরণ করুন
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module">
      import { initPageLayout } from '/assets/js/components/layout.js';
      import { showAlert } from '/assets/js/components/alert.js';

      initPageLayout({
        activePage: 'contact',
        breadcrumbs: [{ label: 'যোগাযোগ', url: '/contact.html' }]
      });

      document.getElementById('contact-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        showAlert({
          type: 'success',
          message: 'আপনার বার্তা সফলভাবে গৃহীত হয়েছে। মাদ্রাসা কর্তৃপক্ষ দ্রুত যোগাযোগ করবে।'
        });
        e.target.reset();
      });
    </script>
  </body>
</html>
